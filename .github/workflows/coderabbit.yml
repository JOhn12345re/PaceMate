name: Code Quality Analysis

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - main
      - develop

jobs:
  code-quality:
    runs-on: ubuntu-latest
    name: ESLint & Quality Checks
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run ESLint
        run: npx eslint . --ext .js --format json --output-file eslint-report.json || true
        continue-on-error: true
      
      - name: Display ESLint Results
        if: always()
        run: |
          echo "📊 ESLint Analysis Results"
          npx eslint . --ext .js || true
      
      - name: Upload ESLint results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eslint-report
          path: eslint-report.json
          retention-days: 30
      
      # CodeRabbit s'exécute automatiquement comme GitHub App
      # Pas besoin d'action ici - il suffit de l'installer sur le repo

