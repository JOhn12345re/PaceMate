events {
    worker_connections 1024;
}

http {
    upstream pacemate_backend {
        server pacemate:3000;
    }

    # Configuration du cache
    proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=pacemate_cache:10m max_size=1g inactive=60m;

    # Limitation des requêtes
    limit_req_zone $binary_remote_addr zone=pacemate_limit:10m rate=10r/s;

    server {
        listen 80;
        server_name pacemate.app www.pacemate.app;

        # Redirection HTTPS (à activer en production)
        # return 301 https://$server_name$request_uri;

        client_max_body_size 10M;

        # Gzip compression
        gzip on;
        gzip_vary on;
        gzip_min_length 1024;
        gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml+rss;

        # Headers de sécurité
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Proxy vers l'application
        location / {
            proxy_pass http://pacemate_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;

            # Rate limiting
            limit_req zone=pacemate_limit burst=20 nodelay;
        }

        # WebSocket pour Socket.IO
        location /socket.io/ {
            proxy_pass http://pacemate_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Timeouts plus longs pour WebSocket
            proxy_read_timeout 86400;
            proxy_send_timeout 86400;
        }

        # Cache pour les fichiers statiques
        location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
            proxy_pass http://pacemate_backend;
            proxy_cache pacemate_cache;
            proxy_cache_valid 200 30d;
            proxy_cache_valid 404 1m;
            add_header Cache-Control "public, immutable";
            add_header X-Cache-Status $upstream_cache_status;
            expires 30d;
        }

        # Health check
        location /health {
            proxy_pass http://pacemate_backend;
            access_log off;
        }
    }

    # Configuration HTTPS (à configurer avec certificats SSL)
    # server {
    #     listen 443 ssl http2;
    #     server_name pacemate.app www.pacemate.app;

    #     ssl_certificate /etc/nginx/ssl/certificate.crt;
    #     ssl_certificate_key /etc/nginx/ssl/private.key;
    #     ssl_protocols TLSv1.2 TLSv1.3;
    #     ssl_ciphers HIGH:!aNULL:!MD5;
    #     ssl_prefer_server_ciphers on;

    #     # ... même configuration que ci-dessus ...
    # }
}

